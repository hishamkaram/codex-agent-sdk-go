name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Keep the required status check name. go.mod selects the development toolchain.
    name: Test (1.25)
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history kept for any history-dependent checks. The
          # new-code-only ramp (new-from-merge-base) was removed from
          # .golangci.yml once the legacy backlog reached zero; lint now
          # runs full-strength against all code.
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          install-only: true
      - name: Verify SDK and contributor harness
        run: make verify
