name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (1.25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history kept for any history-dependent checks. The
          # new-code-only ramp (new-from-merge-base) was removed from
          # .golangci.yml once the legacy backlog reached zero; lint now
          # runs full-strength against all code.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
      - name: Verify standalone module metadata
        run: |
          GOWORK=off go mod tidy -diff
          GOWORK=off go list -mod=readonly -m all > /dev/null
      - name: Go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      - name: Test with race detector
        run: go test -race -count=1 -p 4 -short -coverprofile=coverage.out ./...
      - name: Enforce coverage minimum (54%)
        run: |
          set -euo pipefail
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t == "" || (t+0) < 54) { print "::error::Coverage "t"% is below the 54% minimum"; exit 1 } }'
      - name: Build check
        run: go build ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
